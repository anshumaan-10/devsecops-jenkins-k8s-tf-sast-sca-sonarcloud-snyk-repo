name: Nuclei DAST Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL for Nuclei scan"
        required: true
        default: "https://demo.testfire.net"

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip git jq

      - name: Install Nuclei v3.4.10
        run: |
          wget https://github.com/projectdiscovery/nuclei/releases/download/v3.4.10/nuclei_3.4.10_linux_386.zip
          unzip -o -q nuclei_3.4.10_linux_386.zip
          sudo mv nuclei /usr/local/bin/

      - name: Download Nuclei Templates
        run: |
          git clone https://github.com/projectdiscovery/nuclei-templates.git $HOME/nuclei-templates
          nuclei -update-templates -t $HOME/nuclei-templates

      - name: Run Nuclei Scan
        run: |
          nuclei -u "${{ github.event.inputs.target_url }}" \
                  -t $HOME/nuclei-templates \
                  -severity critical,high \
                  -o nuclei_report.json \
                  -jsonl
          echo "✅ Nuclei scan finished, report at $GITHUB_WORKSPACE/nuclei_report.json"

      - name: Upload Nuclei Report
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-report
          path: nuclei_report.json

      - name: Fail on High/Critical vulnerabilities
        run: |
          if jq 'select(.info.severity=="critical" or .info.severity=="high")' nuclei_report.json | grep .; then
            echo "❌ High/Critical vulnerabilities found!"
            exit 1
          else
            echo "No High/Critical vulnerabilities detected."
          fi
